name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.1
        with:
          bun-version: 1.3.14

      - name: Cache bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: |
            ~/.bun/install/cache/
            node_modules/.cache/
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run compile

      - name: Unit tests
        run: bun run test

      - name: Build smoke
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build

      - name: Install Playwright chromium + system deps
        run: bunx playwright install --with-deps chromium

      - name: E2E (xvfb for MV3 extension)
        run: xvfb-run -a bun run test:e2e:light
