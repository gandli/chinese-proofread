<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">chinese-proofread 中文校对助手 — 浏览器本地 AI 中文长文智能校对</title>
  <desc id="hero-desc">本地离线运行的中文校对浏览器扩展，红色波浪线标出错别字并给出修正建议。</desc>

  <!-- 背景 -->
  <rect width="1200" height="400" fill="#0f172a" rx="16"/>

  <!-- 左侧标题区 -->
  <text x="64" y="92" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#ffffff">chinese-proofread</text>
  <text x="64" y="132" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="22" fill="#94a3b8">中文校对助手</text>
  <text x="64" y="196" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#cbd5e1">浏览器本地 AI 中文长文智能校对</text>
  <text x="64" y="226" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="18" fill="#cbd5e1">离线可用 · 隐私保护 · 文字不离浏览器</text>

  <!-- 特性标签 -->
  <rect x="64" y="262" width="112" height="36" rx="18" fill="#1e293b"/>
  <text x="120" y="286" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#38bdf8" text-anchor="middle">⚡ 本地推理</text>
  <rect x="192" y="262" width="112" height="36" rx="18" fill="#1e293b"/>
  <text x="248" y="286" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#4ade80" text-anchor="middle">🔒 零上传</text>
  <rect x="320" y="262" width="112" height="36" rx="18" fill="#1e293b"/>
  <text x="376" y="286" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#fbbf24" text-anchor="middle">📖 长文支持</text>

  <!-- 左侧底部元信息 -->
  <text x="64" y="352" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#64748b">MacBERT4CSC · ONNX · WebGPU / WASM</text>

  <!-- 右侧编辑器面板 -->
  <rect x="560" y="52" width="576" height="296" rx="12" fill="#1e293b"/>
  <!-- 顶部栏 -->
  <circle cx="584" cy="76" r="6" fill="#f87171"/>
  <circle cx="604" cy="76" r="6" fill="#fbbf24"/>
  <circle cx="624" cy="76" r="6" fill="#4ade80"/>
  <text x="644" y="81" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">校对结果 · 2 处疑似错误</text>

  <!-- 正文行：今天新情很好 -->
  <text x="584" y="140" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="30" fill="#e2e8f0">
    <tspan>今天</tspan><tspan fill="#f87171" text-decoration="underline" text-decoration-color="#f87171">新情</tspan><tspan>很好。</tspan>
  </text>
  <!-- 新情 波浪线 (红色) -->
  <path d="M608 150 q6 5 12 0 q6 -5 12 0" stroke="#f87171" stroke-width="2.5" fill="none"/>
  <path d="M632 150 q6 5 12 0 q6 -5 12 0" stroke="#f87171" stroke-width="2.5" fill="none"/>

  <!-- 修正气泡：新情 → 心情 (右侧空白区, 避开正文与波浪线) -->
  <rect x="936" y="104" width="176" height="44" rx="8" fill="#f87171"/>
  <text x="950" y="131" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="17" fill="#ffffff">新情 → 心情</text>

  <!-- 正文行：我也很高心 -->
  <text x="584" y="210" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="30" fill="#e2e8f0">
    <tspan>我也很</tspan><tspan fill="#f87171" text-decoration="underline" text-decoration-color="#f87171">高心</tspan><tspan>。</tspan>
  </text>
  <!-- 高心 波浪线 -->
  <path d="M724 220 q6 5 12 0 q6 -5 12 0" stroke="#f87171" stroke-width="2.5" fill="none"/>
  <path d="M748 220 q6 5 12 0 q6 -5 12 0" stroke="#f87171" stroke-width="2.5" fill="none"/>

  <!-- 修正气泡：高心 → 高兴 (右侧空白区, 避开正文与波浪线) -->
  <rect x="936" y="196" width="176" height="44" rx="8" fill="#f87171"/>
  <text x="950" y="223" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="17" fill="#ffffff">高心 → 高兴</text>

  <!-- 正常行 -->
  <text x="584" y="280" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="30" fill="#e2e8f0">明天也要加油。</text>
  <text x="584" y="322" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="30" fill="#64748b">后天继续努力。</text>
</svg>
