<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="410" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="20" y="20" width="760" height="30" rx="8" fill="#334155"/>
  <circle cx="40" cy="35" r="5" fill="#f87171"/>
  <circle cx="60" cy="35" r="5" fill="#fbbf24"/>
  <circle cx="80" cy="35" r="5" fill="#34d399"/>
  <text x="200" y="39" font-family="monospace" font-size="11" fill="#e2e8f0">https://example.com/article</text>

  <text x="40" y="80" font-family="serif" font-size="18" fill="#1e293b">中文校对预览 — 高亮模式</text>
  <text x="40" y="110" font-family="serif" font-size="14" fill="#475569">点击错误字词，红波浪线下划线标记疑似错别字。</text>

  <g transform="translate(40,150)">
    <text x="0" y="0" font-family="serif" font-size="14" fill="#1e293b">今天</text>
    <text x="36" y="0" font-family="serif" font-size="14" fill="#1e293b">天气</text>
    <text x="72" y="0" font-family="serif" font-size="14" fill="#1e293b">非常</text>
    <text x="108" y="0" font-family="serif" font-size="14" fill="#1e293b">好，</text>
    <text x="144" y="0" font-family="serif" font-size="14" fill="#1e293b">适合</text>
    <text x="180" y="0" font-family="serif" font-size="14" fill="#1e293b">外出</text>
    <text x="216" y="0" font-family="serif" font-size="14" fill="#1e293b">散步。</text>
  </g>

  <g transform="translate(40,200)">
    <text x="0" y="0" font-family="serif" font-size="14" fill="#1e293b">注意</text>
    <text x="36" y="0" font-family="serif" font-size="14" fill="#1e293b">以下</text>
    <text x="72" y="0" font-family="serif" font-size="14" fill="#1e293b">几个</text>
    <text x="108" y="0" font-family="serif" font-size="14" fill="#1e293b">常见</text>
    <text x="144" y="0" font-family="serif" font-size="14" fill="#ef4444" font-weight="bold">错别</text>
    <text x="180" y="0" font-family="serif" font-size="14" fill="#ef4444" font-weight="bold">字例</text>
    <text x="216" y="0" font-family="serif" font-size="14" fill="#ef4444" font-weight="bold">子：</text>
  </g>
  <line x1="40" y1="210" x2="240" y2="210" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>

  <g transform="translate(40,260)">
    <rect x="0" y="-30" width="600" height="80" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="600" cy="-10" r="8" fill="#ef4444"/>
    <text x="20" y="0" font-family="monospace" font-size="13" fill="#ef4444">✗ "错别"</text>
    <text x="140" y="0" font-family="monospace" font-size="13" fill="#64748b">→</text>
    <text x="170" y="0" font-family="monospace" font-size="13" fill="#16a34a">✓ "错"</text>
    <text x="220" y="0" font-family="monospace" font-size="13" fill="#64748b">(置信度 0.92)</text>
    <text x="20" y="25" font-family="monospace" font-size="11" fill="#64748b">点击"采纳"原地替换  |  "忽略"仅移除高亮  |  Ctrl+Z 撤销</text>
  </g>

  <text x="40" y="360" font-family="monospace" font-size="11" fill="#94a3b8">[ Popup ] 错误字词气泡 — 采纳 / 忽略 / 撤销</text>
  <text x="40" y="380" font-family="monospace" font-size="11" fill="#94a3b8">[ Sidebar ] 侧边栏错误列表 + 批量操作</text>
  <text x="40" y="400" font-family="monospace" font-size="11" fill="#94a3b8">[ Options ] 行业词库管理（JSON 导入导出）</text>
</svg>